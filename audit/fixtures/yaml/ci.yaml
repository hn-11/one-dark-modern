%YAML 1.2
---
# CI-like workflow document: anchors, aliases, block scalars, tags, flow style.
name: audit
on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

defaults: &defaults
  runs-on: ubuntu-latest
  timeout-minutes: 15
  env:
    CI: true
    FORCE_COLOR: 1
    NODE_OPTIONS: "--max-old-space-size=4096"

env:
  RETRIES: 3
  THRESHOLD: 0.75
  HEX: 0x1f
  NOTHING: null
  EMPTY: ~
  ENABLED: yes
  DISABLED: off
  WHEN: 2026-08-12
  BIG: 1_000
  NEG: -12
  EXP: 1.5e-3

jobs:
  build:
    <<: *defaults
    name: build & typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "23.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Multi-line literal block
        run: |
          export PATH="$PATH:$HOME/go/bin"
          npm run typecheck
          npm run audit
      - name: Folded block scalar
        run: >-
          echo "this is one long logical line"
          && echo "that got folded across sources"
      - name: Quoted strings
        run: 'echo ''single quoted with an escape'' && echo "double \"quoted\""'

  matrix:
    <<: *defaults
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 23]
        include:
          - { os: ubuntu-latest, node: 23, primary: true }
        exclude:
          - os: windows-latest
            node: 22
    steps:
      - run: npm test
        if: ${{ matrix.primary }}

# Second document in the same stream
---
kind: ConfigMap
metadata:
  name: theme-config
  labels:
    app.kubernetes.io/name: one-dark-modern
data:
  colors: !!str "#282c34"
  list: !!seq [a, b, c]
  ratio: !!float 0.5
...
