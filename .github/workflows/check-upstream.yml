# Weekly upstream sync: re-fetch the Microsoft workbench themes (Dark Modern
# and 2026 Dark, VS Code's default dark theme since 1.113), rebuild with our
# overrides/ applied, and open an auto-merge PR. CI (build + flicker-audit)
# is the merge gate;
# overrides win over upstream by construction, so nothing customized can
# revert. Syntax colors have no upstream: syntax/ is this repository's own
# source of truth (vendored at v0.1.0, curated under docs/PHILOSOPHY.md).
name: Sync upstream themes

on:
  schedule:
    - cron: "0 6 * * 1" # weekly (Mon 06:00 UTC) while 2026 Dark churns as the new default; drop back to monthly ("0 6 1 * *") once it stabilizes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # open the auto-merge PR and enable auto-merge on it
      contents: write
      pull-requests: write
      # approve the action_required run left behind on the bot-authored PR
      # (see the "Approve the gated run" step below)
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project

      - name: Fetch upstream theme files
        run: |
          curl -sSfL -o upstream/dark_modern.json \
            https://raw.githubusercontent.com/microsoft/vscode/main/extensions/theme-defaults/themes/dark_modern.json
          curl -sSfL -o upstream/2026-dark.json \
            https://raw.githubusercontent.com/microsoft/vscode/main/extensions/theme-defaults/themes/2026-dark.json

      - name: Sanity-check fetched upstream files
        run: |
          for f in upstream/dark_modern.json upstream/2026-dark.json; do
            node -e '
              const fs = require("fs");
              const f = process.argv[1];
              const s = fs.readFileSync(f, "utf8");
              if (!s.trim() || !s.includes("\"colors\"")) {
                console.error(`upstream file looks malformed or empty: ${f}`);
                process.exit(1);
              }
            ' "$f"
          done

      - name: Rebuild theme from new snapshots
        run: npm run build

      - name: Open PR if anything changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/upstream-sync
          commit-message: "chore: sync upstream themes (Dark Modern / 2026 Dark)"
          title: "Sync upstream themes (Dark Modern / 2026 Dark)"
          body: |
            Automated upstream sync. The diff of `upstream/` shows what changed
            in the sources; `themes/` is the rebuilt result with our
            `overrides/` applied on top.

            CI validates the build. If a change looks wrong, add or adjust an
            entry in `overrides/` on this branch before merging.

      # A pull_request run for a PR opened by github-actions[bot] lands in
      # action_required and never clears on its own. Dispatching CI attaches
      # passing checks to the same head SHA, but the abandoned suite still
      # blocks the merge box, so it has to be approved too.
      - name: Run CI on the sync branch
        if: steps.pr.outputs.pull-request-number != ''
        run: gh workflow run ci.yml --ref chore/upstream-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}

      - name: Approve the gated run
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          for _ in $(seq 1 18); do
            id=$(gh run list --commit "$sha" --status action_required \
                   --limit 5 --json databaseId --jq '.[0].databaseId')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"
              exit 0
            fi
            sleep 10
          done
          echo "no gated run appeared for $sha" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
