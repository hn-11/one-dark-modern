# Gate for every push/PR. Two required checks (see the "main protection"
# ruleset): `build` is the fast correctness gate, `flicker-audit` is the
# slower TM-vs-semantic verification. Auto-merged upstream-sync PRs wait
# for both.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, reproducible build, packaging, and static .icls validation.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check generated theme is committed
        run: git diff --exit-code themes/
      - run: npm run package
      - name: Validate JetBrains scheme (XML + attribute keys)
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          xmllint --noout dist/jetbrains/OneDarkModern.icls
          node scripts/audit-jetbrains.ts
      - name: Accent-family guard (One Dark 2026)
        run: node scripts/audit-accent.ts
      # dist/ is generated, not committed, so this has to live in the job
      # that runs `npm run build` rather than with the other audits.
      - name: Terminal/Vim artifact checks
        run: npm run audit:artifacts

  # Real-grammar + real-LSP flicker audit (scripts/audit-flicker.ts):
  # flags tokens whose color changes when semantic highlighting lands.
  flicker-audit:
    runs-on: ubuntu-latest
    # 20, not 15: rust-analyzer has to run `cargo metadata` + `cargo check` on
    # the Rust fixture before its semantic tokens are trustworthy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Compute cache month
        id: date
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache gopls
        id: gopls-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/gopls
          # refreshed monthly - keeps CI fast while still tracking gopls releases
          key: gopls-${{ runner.os }}-${{ steps.date.outputs.month }}
      - name: Install gopls
        if: steps.gopls-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: Cache rust-analyzer
        id: rust-analyzer-cache
        uses: actions/cache@v6
        with:
          # the real component binary - ~/.cargo/bin/rust-analyzer is only a
          # rustup shim and exists even when the component is not installed
          path: ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rust-analyzer
          # same monthly refresh as gopls: fast CI, still tracks releases
          key: rust-analyzer-${{ runner.os }}-${{ steps.date.outputs.month }}
      # rustup's component (rather than a standalone release download) so the
      # server always matches the runner's toolchain - a rust-analyzer built
      # against a different rustc reports different token modifiers, which the
      # combo snapshot would (correctly) flag as drift.
      - name: Install rust-analyzer
        if: steps.rust-analyzer-cache.outputs.cache-hit != 'true'
        run: rustup component add rust-analyzer
      # NOT cached: rust-src is a source tree, not a binary, and rust-analyzer
      # needs it to resolve std - without it `Option::Some` and friends come
      # back as unresolved and half the Rust combos disappear.
      - name: Install rust-src
        run: rustup component add rust-src
      # clangd comes from apt rather than a cached download: the Ubuntu package
      # is what the runner image already has index metadata for, and unlike
      # gopls/rust-analyzer it is a multi-file install (a cached single binary
      # would still be missing its resource directory).
      - name: Install clangd
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clangd >/dev/null
      # taplo is the TOML language server (the one behind the Even Better TOML
      # extension) and the only server that emits the tomlArrayKey/tomlTableKey
      # token types the theme has a semanticTokenColors entry for. The plain
      # `taplo-linux-*` asset is the CLI only - the `-full-` build is the one
      # with the `lsp` subcommand. Pinned, so a taplo release cannot silently
      # change the observed combo set; single binary, so it caches trivially.
      - name: Cache taplo
        id: taplo-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/taplo
          key: taplo-0.9.3-${{ runner.os }}
      - name: Install taplo
        if: steps.taplo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSLf https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-full-linux-x86_64.gz \
            | gunzip > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"
      - run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # rust-analyzer needs a cargo toolchain to load audit/fixtures/rust; the
      # runner image ships one, so this only proves it before the audit runs.
      - name: Check cargo is available
        run: cargo --version && rust-analyzer --version && clangd --version && taplo --version
      - run: npm run audit
      - name: WCAG contrast guard (syntax + ANSI palettes)
        run: npm run audit:contrast
      # Resolution snapshot: fails when a change moves a color anywhere in
      # the fixtures or the selector table. Regenerate with
      # `npm run oracle -- --write` and review the diff.
      - name: Oracle snapshot
        run: npm run oracle -- --check
