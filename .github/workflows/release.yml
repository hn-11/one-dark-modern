# Tag v* -> build all five artifacts and attach them to a GitHub Release.
# Two ways in, and they land in the same place:
#   - `npm version patch` locally (builds, commits, tags, pushes) for a
#     hand-cut release;
#   - workflow_dispatch with a `tag` input, which is how upstream-sync.yml
#     ships an upstream bump - a tag it pushed with GITHUB_TOKEN would not
#     start this workflow, so it dispatches and the release creates the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.4)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project

      - name: Resolve and check the tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On dispatch the tag does not exist yet; gh-release creates it at
          # the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            *.vsix
            dist/jetbrains/OneDarkModern.icls
            dist/ghostty/one-dark-modern
            dist/windows-terminal/one-dark-modern.json
            dist/vim/colors/one-dark-modern.vim
          generate_release_notes: true
