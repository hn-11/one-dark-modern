version: 2
updates:
  - package-ecosystem: github-actions
    # Dependabot does not descend into .github/actions from "/".
    directories:
      - /
      - /.github/actions/setup-node-project
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    ignore:
      # TypeScript 7 is the native port: no lib/tsserver.js, so the flicker
      # audit's language server cannot run on it. VS Code ships the 6.x line.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
