version: 2
updates:
  - package-ecosystem: github-actions
    # Dependabot does not descend into .github/actions from "/".
    directories:
      - /
      - /.github/actions/setup-node-project
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
