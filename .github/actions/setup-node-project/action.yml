name: Setup Node project
description: Node 24 (native TypeScript execution) + npm ci
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          tools/vsce/package-lock.json
    - run: npm ci
      shell: bash
